name: probe

on:

  workflow_dispatch:

jobs:

  verify:

    name: verify runner-level add-host

    runs-on: ubuntu-24.04

    container:

      image: docker.gitea.com/runner-images:ubuntu-24.04

    steps:

    - name: node check

      run: node -e "console.log('node ok')"

    - name: hosts check

      run: cat /etc/hosts && getent hosts git.stfx.eu

    - name: pids check

      run: |

        cg=$(awk -F: '{print $3}' /proc/self/cgroup | head -1)

        echo "pids.max=$(cat /sys/fs/cgroup$cg/pids.max) pids.current=$(cat /sys/fs/cgroup$cg/pids.current)"

    - name: keep alive for inspection

      run: sleep 300
